<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro BroTrack - Completa los datos requeridos para continuar.">
    <title>Formulario - BroTrack</title>
    <link rel="stylesheet" href="../Css/main.css">
    <link rel="icon" href="../Assets/Icons/brotrack-logo.ico" type="image/x-icon">
</head>
<body>

    <nav class="form-nav" aria-label="Navegación principal del formulario">
        <div class="form-nav__inner">

            <div class="form-nav__brand">
                <a href="#" class="form-nav__logo-link" aria-label="Inicio BroTrack">
                    <img
                        class="form-nav__logo"
                        src="../../../Resources/brotrack-logo.png"
                        alt="Logo BroTrack"
                        width="44"
                        height="44"
                    >
                </a>
            </div>

            <div class="form-nav__actions">

                <button type="button" class="btn btn--ghost form-nav__btn" id="btn-back" onclick="window.location.href='../index.html'">
                    <svg class="form-nav__btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 12H5"/><path d="m12 5-7 7 7 7"/>
                    </svg>
                    Atrás
                </button>
                
                <button type="button" class="btn btn--ghost form-nav__btn" id="btn-terms">
                    <svg class="form-nav__btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Términos y condiciones
                </button>
            </div>

        </div>
    </nav>

    <main class="form-main" id="main-content">
        <div class="form-main__wrapper">

            <div class="form-card__header">
                <h1 class="form-card__title">Registro de carreras</h1>
                <p class="form-card__subtitle">Completa todos los campos para enviar tu reporte correctamente.</p>
            </div>

            <div class="form-card">
                <form class="form" id="form-registro" novalidate>

                    <div class="form__grid">

                        <div class="form__group">

                            <label class="form__label" for="id-carrera">
                                IDENTIFICADOR DE LA CARRERA
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <input class="form__input" type="text" id="id-carrera" name="idCarrera" placeholder="Automático" required readonly>
                        </div>

                        <div class="form__group">
                            <label class="form__label" for="fecha">
                                FECHA DE REALIZACIÓN
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <input
                                class="form__input form__input--date"
                                type="date"
                                id="fecha"
                                name="fecha"
                                required
                            >
                        </div>

                        <div class="form__group">
                            <label class="form__label" for="tipo">
                                TIPO
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <div class="form__select-wrapper">
                                <select class="form__select" id="tipo" name="tipo" required>
                                    <option value="Vuelta">Vuelta</option>
                                    <option value="Ida">Ida</option>
                                    <option value="Selecciona un tipo" disabled selected>Selecciona un tipo</option>
                                    
                                </select>
                                <svg class="form__select-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </div>
                        </div>

                        <div class="form__group">
                            <label class="form__label" for="precio">
                                PRECIO
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <div class="form__input-wrapper">
                                <span class="form__input-prefix" aria-hidden="true">$</span>
                                <input
                                    class="form__input form__input--prefixed"
                                    type="number"
                                    id="precio"
                                    name="precio"
                                    placeholder="4000"
                                    min="0"
                                    step="0.01"
                                    autocomplete="off"
                                    required
                                    readonly
                                >
                            </div>
                        </div>

                        <div class="form__group">
                            <label class="form__label" for="mes">
                                MES VIGENTE
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <div class="form__select-wrapper">
                                <select class="form__select" id="mes" name="mes" required>

                                    <option value="Agosto">Agosto</option>
                                    <option value="Septiembre">Septiembre</option>
                                    <option value="Octubre">Octubre</option>
                                    <option value="Agosto">Noviembre</option>
                                    <option value="Agosto">Diciembre</option>
                                    <option value="" disabled selected>Selecciona un mes</option>
                                    
                                </select>
                                <svg class="form__select-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </div>
                        </div>

                        <div class="form__group">
                            <label class="form__label" for="ciclo">
                                CICLO (QUINCENA)
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <div class="form__select-wrapper">
                                <select class="form__select" id="ciclo" name="ciclo" required>
                                    <option value="1">1</option>
                                    <option value="1">2</option>
                                    <option value="" disabled selected>Selecciona un ciclo</option>
                                </select>
                                <svg class="form__select-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </div>
                        </div>

                        <div class="form__group">
                            <label class="form__label" for="estado">
                                ESTADO
                                <span class="form__required" aria-hidden="true">*</span>
                            </label>
                            <div class="form__select-wrapper">
                                <select class="form__select" id="estado" name="estado" required>
                                    <option value="Realizada">Realizada</option>
                                    <option value="Cancelada">Cancelada</option>
                                    <option value="No planeada">No planeada</option>
                                    <option value="" disabled selected>Selecciona un estado</option>
                                    
                                </select>
                                <svg class="form__select-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"/>
                                </svg>
                            </div>
                        </div>

                    </div>

                    <div class="form__group form__group--full">
                        <label class="form__label" for="motivo">
                            MOTIVO
                        </label>
                        <textarea
                            class="form__textarea"
                            id="motivo"
                            name="motivo"
                            placeholder="Describe el motivo de la carrera cancelada..."
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <!-- Nota de campos obligatorios -->
                    <p class="form__note">
                        <span class="form__required" aria-hidden="true">*</span> Algunos campos son obligatorios
                    </p>

                    <!-- Botón enviar -->
                    <div class="form__actions">
                        <button type="submit" class="btn btn--primary form__submit" id="btn-submit">
                            <svg class="form-nav__btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                            Guardar
                        </button>
                    </div>

                </form>
            </div><!-- /.form-card -->

        </div>
    </main>

    <!-- ===================== FOOTER ===================== -->
    <footer class="form-footer" role="contentinfo">
        <div class="form-footer__inner container">
            <p class="form-footer__copy">
                &copy; <span id="year"></span> BroTrack. Todos los derechos reservados.
            </p>
            <nav class="form-footer__links" aria-label="Pie de página">
                <a href="#" class="footer__link form-footer__link">Privacidad</a>
                <a href="#" class="footer__link form-footer__link" id="footer-terms">Términos</a>
            </nav>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
